name: Test, build, and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE="$DOCKERHUB_USERNAME/fastapi-mysql:${GITHUB_SHA}"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy on EC2 through SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "DOCKERHUB_USERNAME contains unsupported characters."
            exit 1
          fi

          COMPOSE_B64="$(base64 -w 0 compose.yaml)"
          DEPLOY_SCRIPT="$(cat <<EOF
          set -euo pipefail
          APP_DIR=/opt/fastapi-mysql-app
          mkdir -p "\$APP_DIR"
          printf '%s' '$COMPOSE_B64' | base64 -d > "\$APP_DIR/compose.yaml"
          cd "\$APP_DIR"
          export DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME'
          export IMAGE_TAG='$IMAGE_TAG'
          docker compose --env-file .env -f compose.yaml pull app
          docker compose --env-file .env -f compose.yaml up -d --no-build --remove-orphans
          docker image prune -af --filter 'until=72h'
          echo "Deployment completed successfully."
          EOF
          )"
          ENCODED_SCRIPT="$(printf '%s' "$DEPLOY_SCRIPT" | base64 -w 0)"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy commit $IMAGE_TAG via GitHub Actions" \
            --parameters "commands=[\"echo $ENCODED_SCRIPT | base64 -d | bash\"]" \
            --query "Command.CommandId" \
            --output text)"

          echo "SSM command sent: $COMMAND_ID"
          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"; then
            echo "SSM command did not complete successfully; retrieving execution details."
          fi

          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)"
          echo "Command status: $STATUS"
          echo "Deployment output:"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          if [[ "$STATUS" != "Success" ]]; then
            echo "Deployment error output:"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi
